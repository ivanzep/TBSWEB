<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Files | The Brown Studio</title>
<meta name="description" content="Every image and drawing across every review set, in one sortable, filterable view.">
<link rel="icon" href="./assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

<div id="scrollProgress"></div>

<header class="site-header is-solid" id="siteHeader">
  <div class="header-inner">
    <a href="./index.html" class="logo">
      <img class="logo-img" id="logoImg" src="./assets/img/logo.png" alt="">
    </a>
    <nav class="nav" id="siteNav">
      <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-expanded="false" aria-controls="driveSidebar">Folders</button>
      <a href="./project.html">Project</a>
      <a href="./all-files.html" class="is-active">All Files</a>
      <a href="./review-log.html">Review Log</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="siteNav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="nav-backdrop" id="navBackdrop"></div>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="drive-sidebar" id="driveSidebar">
  <div class="sidebar-head">
    <div>
      <p class="eyebrow">Drive Folders</p>
      <p class="sidebar-project-title" id="sidebarProjectTitle"></p>
    </div>
    <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close folder panel">✕</button>
  </div>
  <nav class="sidebar-tree" id="sidebarTree" aria-label="Project folders"></nav>
</aside>

<div class="setup-notice" id="setupNotice" hidden></div>

<section class="page-banner">
  <div class="container">
    <div class="page-banner-topline">
      <a class="back-link" href="./project.html" id="backLink">← Project</a>
      <label class="project-switch">
        <span class="sr-only">Switch project</span>
        <select id="projectSwitch"></select>
      </label>
    </div>
    <p class="eyebrow" id="pageEyebrow">Every Set, One View</p>
    <h1 id="pageTitle">All Files</h1>
    <p class="page-banner-note" id="pageNote" hidden></p>

    <div class="toolbar-wrap" id="toolbarWrap">
      <div class="toolbar-row toolbar-quick">
        <button class="filter-btn is-active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="image">Images</button>
        <button class="filter-btn" data-filter="pdf">Drawings</button>
        <button class="filter-btn" id="filterComments">With Comments</button>
        <span class="spacer"></span>
        <div class="grid-size" id="gridSize" role="group" aria-label="Thumbnail size">
          <button type="button" class="filter-btn" data-size="sm" aria-label="Small thumbnails">S</button>
          <button type="button" class="filter-btn is-active" data-size="md" aria-label="Medium thumbnails">M</button>
          <button type="button" class="filter-btn" data-size="lg" aria-label="Large thumbnails">L</button>
        </div>
      </div>

      <button type="button" class="toolbar-bar" id="toolbarToggle" aria-expanded="false" aria-controls="toolbarStack">
        <span class="toolbar-bar-caret"></span>
        <span class="toolbar-bar-label">Filters &amp; Sort</span>
        <span class="spacer"></span>
        <span class="results-count" id="resultsCount"></span>
      </button>
      <div class="toolbar-stack" id="toolbarStack" hidden>
        <div class="toolbar-row">
          <label class="field">Set
            <select id="filterSet"><option value="">All sets</option></select>
          </label>
          <label class="field">Sort
            <select id="sortBy">
              <option value="folder">Folder Order</option>
              <option value="set">Set Order</option>
              <option value="name">Name</option>
              <option value="sheet">Sheet Number</option>
              <option value="type">Type</option>
              <option value="comments">Most Comments</option>
              <option value="modified">Recently Modified</option>
            </select>
          </label>
          <button type="button" class="filter-btn" id="sortReverse" aria-pressed="false" aria-label="Reverse sort order" title="Reverse sort order">
            <span class="sort-reverse-icon"></span>
          </button>
          <label class="field">Find
            <input type="search" id="filterText" placeholder="Search files…">
          </label>
          <span class="spacer"></span>
          <div class="grid-size" id="groupToggle" role="group" aria-label="Group view" hidden>
            <button type="button" class="filter-btn" id="expandAll">Expand All</button>
            <button type="button" class="filter-btn" id="collapseAll">Collapse All</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="container">
    <div class="item-grid" id="itemGrid"></div>
    <div class="empty-state" id="emptyState" hidden></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-inner">
    <span id="footerName">The Brown Studio · Design + Build</span>
    <span id="footerMeta"></span>
  </div>
</footer>

<!-- ── Viewer overlay ─────────────────────────────────────────────────────
     Same overlay as a review set's page — opened here with whatever the
     current filter/sort has on screen, so arrowing crosses set boundaries. -->
<div class="modal-overlay viewer" id="viewer">

  <div class="viewer-bar">
    <span class="v-title" id="viewerTitle"></span>
    <span class="v-counter" id="viewerCounter"></span>
    <span class="spacer"></span>

    <span class="viewer-zoom" id="viewerZoom">
      <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
      <span id="zoomLevel">100%</span>
      <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="zoomReset" aria-label="Reset zoom">⤢</button>
    </span>

    <button type="button" class="v-btn" id="viewerMarkup">Add Markup</button>
    <button type="button" class="v-btn" id="viewerPanelToggle">Panel</button>
    <button type="button" class="v-btn" id="viewerClose">Close ✕</button>
  </div>

  <div class="viewer-stage" id="viewerStage">
    <div class="viewer-wrap" id="viewerWrap">
      <img id="viewerImg" alt="">
      <div class="viewer-pins" id="viewerPins"></div>
    </div>
    <div class="viewer-fallback" id="viewerFallback" hidden></div>
  </div>

  <div class="viewer-embed" id="viewerEmbed" hidden>
    <iframe id="viewerFrame" title="Document viewer" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>

  <button type="button" class="viewer-nav prev" id="viewerPrev" aria-label="Previous">‹</button>
  <button type="button" class="viewer-nav next" id="viewerNext" aria-label="Next">›</button>

  <div class="viewer-filmstrip" id="viewerFilmstrip"></div>
  <aside class="viewer-panel" id="viewerPanel"></aside>
</div>

<div id="toast"></div>

<script src="./assets/js/config.js"></script>
<script src="./assets/js/projects.js"></script>
<script src="./assets/js/packages.js"></script>
<script src="./assets/js/folder-tree.js"></script>
<script src="./assets/js/drive.js"></script>
<script src="./assets/js/store.js"></script>
<script src="./assets/js/sheet-sync.js"></script>
<script src="./assets/js/common.js"></script>
<script src="./assets/js/sidebar.js"></script>
<script src="./assets/js/viewer.js"></script>
<script src="./assets/js/items-grid.js"></script>
<script src="./assets/js/all-files.js"></script>
</body>
</html>
